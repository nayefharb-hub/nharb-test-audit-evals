[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harbour-booking"
version = "0.4.0"
description = "Booking, availability and cancellation rules for Harbour Stays"
requires-python = ">=3.11"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
packages = ["booking"]

[tool.pytest.ini_options]
testpaths = ["tests", "contracts"]
addopts = "-ra"
