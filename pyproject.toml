[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "invoicer"
version = "0.3.0"
description = "Small invoice service: line items, tax, due dates and currency conversion."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["invoicer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
