[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nudge"
version = "0.4.0"
description = "Schedule and send appointment reminders"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-dateutil>=2.8",
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
nudge = "nudge.cli:main"

[tool.setuptools.packages.find]
include = ["nudge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
