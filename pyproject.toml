[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "unitconv"
version = "0.1.0"
description = "Small, dependency-free unit conversion library"
requires-python = ">=3.9"
readme = "README.md"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["unitconv*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
